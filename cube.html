<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotating RGB Cube</title>

<style>
@property --hue {
    syntax: "<number>";
    inherits: true;
    initial-value: 0;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    display: grid;
    place-items: center;
    background: #111;
    perspective: 700px;
    overflow: hidden;
}

.cube {
    --hue: 0;

    width: 180px;
    height: 180px;

    position: relative;
    transform-style: preserve-3d;

    animation:
        tumble 24s linear infinite,
        huecycle 30s linear infinite;
}

.face {
    position: absolute;
    width: 180px;
    height: 180px;
    box-sizing: border-box;
    backface-visibility: visible;
}


/* Three colored faces */

.front {
    transform: translateZ(90px);
    background: hsl(var(--hue) 55% 34%);
}

.right {
    transform:
        rotateY(90deg)
        translateZ(90px);

    background: hsl(var(--hue) 55% 24%);
}

.top {
    transform:
        rotateX(90deg)
        translateZ(90px);

    background: hsl(var(--hue) 55% 44%);
}


/* Three black faces */

.back {
    transform:
        rotateY(180deg)
        translateZ(90px);

    background: #000;
}

.left {
    transform:
        rotateY(-90deg)
        translateZ(90px);

    background: #000;
}

.bottom {
    transform:
        rotateX(-90deg)
        translateZ(90px);

    background: #000;
}


/* Two-axis tumble */

@keyframes tumble {
    from {
        transform:
            rotateX(0deg)
            rotateY(0deg);
    }

    to {
        transform:
            rotateX(360deg)
            rotateY(720deg);
    }
}


/* Hue cycle */

@keyframes huecycle {
    from {
        --hue: 0;
    }

    to {
        --hue: 360;
    }
}

</style>
</head>

<body>

<div class="cube">
    <div class="face front"></div>
    <div class="face back"></div>

    <div class="face right"></div>
    <div class="face left"></div>

    <div class="face top"></div>
    <div class="face bottom"></div>
</div>

</body>
</html>
